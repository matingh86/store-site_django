<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود با کد تایید</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .otp-card {
            max-width: 400px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card otp-card border-0 bg-white p-4">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">ورود / ثبت‌نام</h4>
            <p class="text-muted small mb-0">شماره موبایل خود را وارد کنید</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="phone_number" class="form-label small fw-semibold text-secondary">شماره موبایل</label>
                <input 
                    type="text" 
                    id="phone_number"
                    name="phone_number" 
                    class="form-control text-center fs-5 rounded-3" 
                    placeholder="09123456789" 
                    maxlength="11" 
                    required 
                    autofocus
                >
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">
                ارسال کد تایید
            </button>
        </form>
    </div>

</body>
</html>
