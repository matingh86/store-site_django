<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت موفقیت‌آمیز</title>
    <!-- Bootstrap RTL CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .success-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #d1e7dd;
            color: #0f5132;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -40px auto 1rem auto;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card success-card text-center p-4">
                    <!-- آیکون موفقیت -->
                    <div class="icon-circle">
                        <i class="bi bi-check-circle-fill fs-1"></i>
                    </div>
                    
                    <h3 class="fw-bold text-success mb-2">پرداخت با موفقیت انجام شد</h3>
                    <p class="text-muted mb-4">با تشکر از خرید شما! سفارش شما ثبت شد و در حال پردازش است.</p>

                    <!-- جزئیات پرداخت -->
                    <div class="bg-light rounded-3 p-3 mb-4 text-start">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">شماره سفارش:</span>
                            <span class="fw-bold">#{{ order.id }}</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">کد پیگیری بانک:</span>
                            <span class="fw-bold text-primary">{{ ref_id }}</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">مبلغ پرداختی:</span>
                            <span class="fw-bold">{{ order.get_cost }} تومان</span>
                        </div>
                    </div>

                    <!-- دکمه‌های اقدام -->
                    <div class="d-grid gap-2">
                        <a href="{% url 'shop:product_list' %}" class="btn btn-success btn-lg">
                            <i class="bi bi-house-door me-1"></i> بازگشت به فروشگاه
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
