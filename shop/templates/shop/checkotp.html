<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید کد</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .otp-card {
            max-width: 400px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .code-input {
            letter-spacing: 0.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card otp-card border-0 bg-white p-4">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">کد تایید را وارد کنید</h4>
            <p class="text-muted small mb-0">کد ارسال شده به شماره <strong class="text-dark">{{ phone }}</strong></p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <input 
                    type="text" 
                    name="code" 
                    class="form-control text-center fs-3 code-input rounded-3" 
                    placeholder="------" 
                    maxlength="6" 
                    required 
                    autofocus 
                    autocomplete="off"
                >
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold">
                ورود به سایت
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'shop:sendotp' %}" class="text-decoration-none small text-muted">
                ویرایش شماره موبایل
            </a>
        </div>
    </div>

</body>
</html>
